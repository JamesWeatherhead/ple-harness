name: ple-harness
model_api: google-cloud/gemini-4-neon
install: >-
  uv venv --python 3.12 /opt/harness/venv
  && uv pip install --python /opt/harness/venv/bin/python -r {src}/requirements.txt
serve: /opt/harness/venv/bin/python {src}/serve.py
env:
  COMPACT_AT_TOKENS: "140000"
  RESERVE_VERIFY_SEC: "150"
  BUDGET_CAP_USD: "0"
  MCP_DISCOVERY_MODE: "ondemand"
  ENABLE_EVIDENCE_LEDGER: "true"
  ENABLE_EXPORT_VERIFIER: "true"
  ENABLE_INCUMBENT_RETENTION: "true"
  ENABLE_IMAGE_INPUT: "false"
  MAX_VERIFY_REPAIRS: "2"
